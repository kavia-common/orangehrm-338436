# Cucumber JUnit Platform Configuration
# This file is automatically picked up by the JUnit Platform engine.

# Enable parallel execution (disabled by default for stability)
cucumber.execution.parallel.enabled=false

# Naming strategy for test display names in reports
cucumber.junit-platform.naming-strategy=long

# Cucumber plugin configuration (also configurable via runner annotations)
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber-report.html, json:target/cucumber-reports/cucumber-report.json

# Glue path for step definitions discovery
cucumber.glue=com.orangehrm.stepdefinitions

# Feature files location
cucumber.features=src/test/resources/features
