# =============================================================================
# OrangeHRM Cucumber Test Configuration
# =============================================================================
# These values can be overridden by:
#   1. System properties  (e.g., -Dheadless=true)
#   2. Environment variables (e.g., export headless=true)
#
# Run commands:
#   Non-headless (visible browser, default):  mvn test
#   Headless (CI/server):                     mvn test -Dheadless=true
#                                          or mvn test -Pheadless
# =============================================================================

# Base URL of the OrangeHRM application under test
# Override with: -DORANGEHRM_BASE_URL=http://your-server:port
# Or environment variable: ORANGEHRM_BASE_URL
ORANGEHRM_BASE_URL=http://localhost:8080

# Default username for login tests
# Override with environment variable: ORANGEHRM_USERNAME
ORANGEHRM_USERNAME=Admin

# SECURITY: Password should be set via environment variable, NOT in this file.
# Set it before running tests:
#   export ORANGEHRM_PASSWORD=your_password
# Or via system property:
#   mvn test -DORANGEHRM_PASSWORD=your_password
# If not set, a well-known default is used (see TestConfig.java).
# ORANGEHRM_PASSWORD=  <-- Do not hardcode passwords here

# Browser configuration (chrome or firefox)
# Override with: -Dbrowser=firefox or -Pfirefox
browser=chrome

# Headless mode toggle
#   false = VISIBLE mode (default) – browser window opens on screen, you can
#           watch actions like login happen in real time. Requires a display.
#   true  = HEADLESS mode – no browser window, suitable for CI/CD pipelines.
#           No xvfb-run or virtual display needed.
#
# Override with: -Dheadless=true  or  -Pheadless Maven profile
headless=false
