# ============================================================
# OrangeHRM Selenium Test Configuration
# ============================================================

# Base URL for the OrangeHRM application under test
# Override via system property: -DbaseUrl=<url>
base.url=https://opensource-demo.orangehrmlive.com

# Browser configuration
# Supported: chrome, chromium
browser=chrome

# Headless mode (true for CI, false for local debugging)
# Override via system property: -Dheadless=true|false
browser.headless=true

# Implicit wait timeout in seconds
wait.implicit=5

# Explicit wait timeout in seconds
wait.explicit=15

# Page load timeout in seconds
wait.pageLoad=30

# Script timeout in seconds
wait.script=30

# Admin credentials
admin.username=Admin
admin.password=Jacqueline@OHRM123

# ESS user credentials (for role-based tests)
ess.username=John
ess.password=John@OHRM123

# Screenshot on failure
screenshot.on.failure=true
screenshot.dir=target/screenshots
