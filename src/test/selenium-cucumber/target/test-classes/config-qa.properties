# ============================================================
# OrangeHRM Selenium Test Configuration -- QA Profile
# ============================================================
# This file overrides base config.properties values for the QA
# environment. Activate via:
#   -Dtest.environment=qa
#   TEST_ENVIRONMENT=qa
#   mvn test -Pqa
#
# Credentials should be injected via environment variables in
# CI pipelines rather than committed here.
# ============================================================

# --- Application Under Test ---
# QA server URL (no trailing slash)
# Override: -Dbase.url=<url>  or  BASE_URL=<url>
base.url=

# --- Browser Configuration ---
browser=chrome
browser.headless=true

# --- Timeouts (seconds) -- QA may be slower ---
# Implicit wait is 0 — all lookups use explicit waits for reliability.
wait.implicit=0
wait.explicit=20
wait.pageLoad=45
wait.script=45

# --- Driver Initialization ---
driver.init.retries=3

# --- Admin Credentials (inject via env vars in CI) ---
# Override: ADMIN_USERNAME / ADMIN_PASSWORD env vars
admin.username=
admin.password=

# --- ESS User Credentials ---
ess.username=
ess.password=

# --- Database Configuration (optional) ---
# QA database connection for data-verification tests
# Example: db.url=jdbc:mysql://qa-db-host:3306/orangehrm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.url=
db.username=
db.password=
db.driver=com.mysql.cj.jdbc.Driver
