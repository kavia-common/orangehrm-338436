# ============================================================================
# Cucumber Runtime Configuration
# ============================================================================
#
# Flow name: CucumberParallelConfig
#
# Cucumber 7+ supports native parallel execution at the scenario level.
# Combined with ThreadLocal WebDriver (DriverFactory) and per-scenario
# PicoContainer DI (Hooks, step classes), this provides full isolation
# without requiring separate JVM forks.
#
# Override via system properties:
#   mvn test -Dcucumber.execution.parallel.enabled=true
#   mvn test -Dcucumber.execution.parallel.config.fixed.parallelism=4
# ============================================================================

# Enable parallel scenario execution by default.
# Set to false for sequential debugging: mvn test -Dcucumber.execution.parallel.enabled=false
cucumber.execution.parallel.enabled=true

# Execution strategy: fixed thread pool (predictable resource usage in CI).
# Alternative: "dynamic" adapts to available cores.
cucumber.execution.parallel.config.strategy=fixed

# Number of parallel threads. 2 is a safe default for CI.
# Override: -Dcucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.parallelism=2

# Maximum parallelism cap (safety limit).
cucumber.execution.parallel.config.fixed.max-pool-size=4

# Publish reports to Cucumber cloud (already set in TestRunner, but explicit here).
cucumber.publish.quiet=true
