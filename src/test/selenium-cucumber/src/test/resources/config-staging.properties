# ============================================================
# OrangeHRM Selenium Test Configuration -- Staging Profile
# ============================================================
# This file overrides base config.properties values for the
# staging environment. Activate via:
#   -Dtest.environment=staging
#   TEST_ENVIRONMENT=staging
#   mvn test -Pstaging
#
# Credentials should be injected via environment variables in
# CI pipelines rather than committed here.
# ============================================================

# --- Application Under Test ---
# Staging server URL (no trailing slash)
# Override: -Dbase.url=<url>  or  BASE_URL=<url>
base.url=

# --- Browser Configuration ---
browser=chrome
browser.headless=true

# --- Timeouts (seconds) -- staging mirrors production ---
wait.implicit=5
wait.explicit=15
wait.pageLoad=30
wait.script=30

# --- Admin Credentials (inject via env vars in CI) ---
# Override: ADMIN_USERNAME / ADMIN_PASSWORD env vars
admin.username=
admin.password=

# --- ESS User Credentials ---
ess.username=
ess.password=

# --- Database Configuration (optional) ---
db.url=
db.username=
db.password=
db.driver=
