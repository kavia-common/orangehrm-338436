# ============================================================
# OrangeHRM Selenium Test Configuration -- Base (dev) Profile
# ============================================================
# Environment-specific overrides: config-qa.properties,
# config-staging.properties, config-production.properties
#
# Resolution precedence (highest wins):
#   1. JVM system property   (-Dbase.url=...)
#   2. OS environment var    (BASE_URL=...)
#   3. Environment overlay   (config-<env>.properties)
#   4. This file             (config.properties)
# ============================================================

# Active environment profile: dev | qa | staging | production
# Override: -Dtest.environment=qa  or  TEST_ENVIRONMENT=qa
test.environment=dev

# --- Application Under Test ---
# Base URL (no trailing slash)
# Override: -DbaseUrl=<url>  or  -Dbase.url=<url>  or  BASE_URL=<url>
base.url=https://opensource-demo.orangehrmlive.com

# --- Browser Configuration ---
# Supported: chrome, firefox
browser=chrome

# Headless mode (true for CI, false for local debugging)
# Override: -Dheadless=true|false  or  BROWSER_HEADLESS=true|false
browser.headless=true

# --- Timeouts (seconds) ---
wait.implicit=5
wait.explicit=15
wait.pageLoad=30
wait.script=30

# --- Admin Credentials ---
# Override: -Dadmin.username=...  or  ADMIN_USERNAME=...
# IMPORTANT: Do not commit real credentials. Use env vars or
# environment-specific property files excluded from VCS.
admin.username=Admin
admin.password=admin123

# --- ESS User Credentials ---
# Override: -Dess.username=...  or  ESS_USERNAME=...
ess.username=
ess.password=

# --- Database Configuration (optional) ---
# Needed only when tests require direct DB verification.
# Override: -Ddb.url=...  or  DB_URL=...
db.url=
db.username=
db.password=
db.driver=

# --- Screenshot Settings ---
screenshot.on.failure=true
screenshot.dir=target/screenshots
