# ============================================================
# OrangeHRM Selenium Test Configuration -- Production Profile
# ============================================================
# This file overrides base config.properties values for the
# production environment. Activate via:
#   -Dtest.environment=production
#   TEST_ENVIRONMENT=production
#   mvn test -Pproduction
#
# IMPORTANT: Production credentials MUST be injected via
# environment variables -- never commit them to this file.
# ============================================================

# --- Application Under Test ---
# Production server URL (no trailing slash)
# Override: -Dbase.url=<url>  or  BASE_URL=<url>
base.url=

# --- Browser Configuration ---
browser=chrome
browser.headless=true

# --- Timeouts (seconds) ---
wait.implicit=5
wait.explicit=15
wait.pageLoad=30
wait.script=30

# --- Admin Credentials (MUST use env vars) ---
# Override: ADMIN_USERNAME / ADMIN_PASSWORD env vars
admin.username=
admin.password=

# --- ESS User Credentials ---
ess.username=
ess.password=

# --- Database Configuration (optional) ---
# Production database connection — credentials MUST come from env vars
# Example: db.url=jdbc:mysql://prod-db-host:3306/orangehrm?useSSL=true&serverTimezone=UTC
db.url=
db.username=
db.password=
db.driver=com.mysql.cj.jdbc.Driver
